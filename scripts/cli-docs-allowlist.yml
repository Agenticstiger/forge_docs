# Drift exceptions for scripts/check_cli_docs.py.
# Update this file when intentionally adding/removing aliases or hiding
# commands from end users.

# Commands the CLI registers but that intentionally have no doc page.
# Add a one-line comment with the reason — future maintainers will thank you.
undocumented_ok:
  - dmm              # short alias for `datamesh-manager`
  - marketplace      # deprecated alias for `market`
  - opds             # legacy spelling kept for back-compat; renamed to `odps`
                     # in v0.8.4. Hidden alias, intentionally undocumented.
  - export-opds      # deprecated back-compat alias (letter-swap of ODPS); logs a
                     # deprecation warning pointing at the canonical
                     # `fluid generate standard --format odps-v4.1`. The
                     # export-odps.md page covers the surface (docs_only_ok below).
  - viz-plan         # hidden (argparse.SUPPRESS) — deprecated, use `plan --html`

# Doc pages with no matching CLI subcommand (e.g. conceptual / index pages).
# Keys are paths relative to docs/cli/, without the .md extension — pages in
# subdirectories are keyed with their directory (`tasks/switch-clouds`). An
# entry ending in `/` allowlists that whole subtree.
docs_only_ok:
  - README           # CLI Reference index page
  - catalogs/        # one page per catalog target (BigQuery, Glue, Unity, ...),
                     # not per CLI command; the commands behind them are
                     # `fluid publish` / `fluid market`. Whole subtree.
  - tasks/           # task-shaped how-tos ("switch clouds", "debug a failed
                     # run") that cut across several commands. Whole subtree.
  - generate-artifacts  # subcommand of `generate`, not a top-level command;
                     # dedicated page because it's the stage-3 surface of the
                     # 11-stage pipeline and operators look up the full name.
  - generate-iac    # subcommand of `generate` (registered in
                    # fluid_build/cli/generate_iac.py::register_subcommand);
                    # dedicated page because PR #140's OpenTofu autogenerator
                    # is a user-facing feature operators look up by full name.
  - generate-vector # subcommand of `generate` (fluid_build/cli/generate_vector.py);
                    # pgvector RAG output port, shipped in v0.11.0. Dedicated page
                    # because operators look it up by full name (like generate-iac).
                    # GA since v0.12.0 (schema 0.7.5 promoted to stable).
  - export-odps     # NOT a registered command at the pinned CLI: the 0.10.0
                    # provider→exporter reclassification retired the top-level
                    # command in favour of `fluid generate standard --format
                    # odps-v4.1`; only the deprecated `export-opds` alias still
                    # registers (undocumented_ok above). Page kept as the
                    # migration reference for the historical surface.

# Fenced `fluid ...` invocations the flag oracle must not report.
# Two forms:
#   - docs/path/page.md                     whole page (glob syntax allowed)
#   - docs/path/page.md::fluid foo --bar    one invocation on that page
# Prefer the second form: it keeps the rest of the page under the gate.
# This is the escape hatch for pages that document a genuinely unreleased
# capability, or a command the core CLI does not register. Say which, and why.
flag_oracle_ok:
  - docs/cli/export-odps.md
                     # The whole page documents the retired top-level
                     # `fluid export-odps`; see the docs_only_ok entry above for
                     # why the page is kept. Every invocation on it is
                     # historical by construction.
  - docs/sdk-and-plugins/**::fluid generate-custom-scaffold
                     # Registered by the companion package
                     # `data-product-forge-custom-scaffold` (pinned in
                     # cli-version.json as supportedCustomScaffoldInstallSpec)
                     # through the command-plugin entry point, so it is absent
                     # from the core CLI's parser. The pages tell the reader to
                     # pip install it first. Scoped to this one invocation.

# Files the version sweep must not scan, as paths relative to the repo root
# (glob syntax allowed). RELEASE_NOTES_*.md is excluded unconditionally and
# needs no entry here. Prefer the in-page `<!-- cli-version: historical -->`
# marker over an entry in this list: the marker exempts one line or one fenced
# block, an entry here blinds a whole file.
version_sweep_ok:
