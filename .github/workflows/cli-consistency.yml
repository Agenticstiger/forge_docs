name: CLI <-> Docs Consistency

on:
  pull_request:
    branches: [main]
    paths:
      # Every page under docs/, not just docs/cli/ and docs/providers/. The
      # gate now reads fenced `fluid ...` invocations and version claims out of
      # the whole tree, and those live in walkthroughs, concepts, recipes and
      # sdk-and-plugins as much as in the command reference. A narrower filter
      # means a PR can add a broken invocation and never run this job.
      - 'docs/**'
      # The repo-root README is a docs surface too, and it is the one GitHub
      # shows first. It is now swept for version claims, so a change to it must
      # run this job.
      - 'README.md'
      - 'scripts/check_cli_docs.py'
      - 'scripts/check_providers.py'
      - 'scripts/gen_contract_reference.py'
      - 'scripts/cli-docs-allowlist.yml'
      - 'scripts/forge-cli-releases.json'
      - '.github/workflows/cli-consistency.yml'
  push:
    branches: [main]
  schedule:
    # Weekly Monday at 06:17 UTC. Catches the case where a new CLI release
    # ships on PyPI but no docs PR opens, by re-running against the same pin.
    - cron: '17 6 * * 1'
  workflow_dispatch:

# Read-only. This job installs a package named by a file in the PR branch and
# runs it, so it must never hold a write token.
permissions:
  contents: read

jobs:
  consistency:
    name: Verify docs match installed fluid CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # The release-marker sweep is the only check here that looks outside the
      # installed package: whether a release contains a given pull request is a
      # fact about forge-cli's history, not about its code, so no version of
      # the CLI can answer it. One unauthenticated GET of a public file, with
      # -f so an HTTP error fails the step instead of leaving an empty file
      # that the sweep would then report as "no release" - and it does fail on
      # that, rather than passing with nothing to compare against.
      #
      # FORGE_CLI_CHANGELOG is exported from here rather than declared in a
      # job-level `env:` block. It used to read `${{ runner.temp }}/...` there,
      # and `runner` is not one of the contexts available to `jobs.<id>.env`
      # (only github, inputs, matrix, needs, secrets, strategy and vars are).
      # That is a workflow validation error, so the whole run ended in a
      # STARTUP FAILURE: zero jobs, no logs, and — the part that hid it — no
      # check run at all, so the gate did not go red, it went missing from
      # every PR check list. Resolve the path in the shell, where RUNNER_TEMP
      # is an ordinary variable, and hand it to later steps through
      # GITHUB_ENV. The workflow-lint job catches the next one of these.
      - name: Fetch forge-cli's CHANGELOG
        run: |
          dest="${RUNNER_TEMP}/forge-cli-CHANGELOG.md"
          curl -sSfL --retry 3 --retry-delay 2 \
            -o "$dest" \
            https://raw.githubusercontent.com/Agenticstiger/forge-cli/main/CHANGELOG.md
          grep -qE '^## \[?[0-9]+\.[0-9]+\.[0-9]+' "$dest"
          echo "FORGE_CLI_CHANGELOG=$dest" >> "$GITHUB_ENV"

      - name: Resolve pinned CLI version
        id: pin
        run: |
          VERSION=$(python -c "import json; print(json.load(open('docs/.vuepress/cli-version.json'))['supportedCliVersion'])")
          INSTALL_SPEC=$(python -c "import json; d=json.load(open('docs/.vuepress/cli-version.json')); print(d.get('supportedCliInstallSpec') or 'data-product-forge==' + d['supportedCliVersion'])")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "install_spec=${INSTALL_SPEC}" >> "$GITHUB_OUTPUT"
          echo "Pinned CLI version: ${VERSION}"
          echo "Pinned CLI install spec: ${INSTALL_SPEC}"

      - name: Install fluid CLI
        # INSTALL_SPEC comes from a JSON file in the PR branch. Interpolating it
        # into the script body with ${{ ... }} would splice attacker-controlled
        # text into the shell before it runs; passing it through env: makes it a
        # shell variable that quoting can contain.
        env:
          INSTALL_SPEC: ${{ steps.pin.outputs.install_spec }}
        run: |
          python -m pip install --upgrade pip
          pip install "$INSTALL_SPEC"
          fluid --version

      - name: Verify fluid --version matches pin
        run: python scripts/check_cli_docs.py --version-only

      - name: Verify docs match the pinned CLI
        # Command/page coverage, the quickstart scaffold pin, the contract-schema
        # pins, the fence-flag oracle, the version sweep and the release-marker
        # sweep (which the step below also runs on its own, for a failure whose
        # step name says what broke).
        run: python scripts/check_cli_docs.py

      - name: Verify documented providers match fluid providers
        run: python scripts/check_providers.py

      - name: Verify no page calls a released pull request unreleased
        # Fails on a page that still says "unreleased" after the release that
        # contains the work shipped, naming the file, the line and that release.
        run: python scripts/check_cli_docs.py --markers-only

      - name: Verify the contract reference matches the bundled schemas
        # docs/reference/contract-*.md are generated from the schemas inside the
        # pinned CLI. --check writes nothing: it fails when a committed page
        # differs from what the installed CLI would generate.
        run: python scripts/gen_contract_reference.py --check
