name: Docs PR Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The build catches ONE class of dead link, not all of them. See the
      # coverage map on the next step before concluding anything is redundant.
      #
      # docs/.vuepress/config.ts sets the theme's linksCheck plugin to
      # `build: 'error'`, so VuePress throws and exits non-zero on a dead
      # internal link *that is written as a markdown link to a .md target*. The
      # plugin filters candidates on /\.md(?:[?#]|$)/, which is about 861 of
      # roughly 1331 internal links; it cannot see links in config.ts, in
      # frontmatter, in raw HTML, or written with a .html / no extension.
      #
      # Nothing here greps the log: a log-string check passes whenever the
      # message wording changes, and it passed for exactly that reason before.
      - name: Build docs (fails on broken internal markdown links)
        run: npm run docs:build

      # ---------------------------------------------------------------------
      # THE ARTIFACT GATE. Every other link gate in this repo reads SOURCE
      # MARKDOWN. This one reads the bytes that get deployed.
      #
      # WHICH GATE COVERS WHICH CLASS — read this before deleting anything.
      # The comment above this step used to call the build "the gate" while it
      # covered about 65% of internal links, and a maintainer could reasonably
      # have deleted link-check.yml believing it redundant. It is not.
      #
      #   link class                                  | build | base-prefix | lychee-source | THIS
      #   --------------------------------------------|-------|-------------|---------------|-----
      #   [x](./y.md) dead target                     |  YES  |      -      |      YES      | YES
      #   [x](/cli/y) missing /forge_docs/ base       |   -   |     YES     |      YES      | YES
      #   navbar / sidebar entry in config.ts         |   -   |      -      |       -       | YES
      #   docs/README.md frontmatter hero actions     |   -   |      -      |       -       | YES
      #   raw <a href="..."> in markdown              |   -   |      -      |      YES      | YES
      #   .html-suffixed and extensionless targets    |   -   |     YES     |      YES      | YES
      #   theme-generated links (prev/next, edit)     |   -   |      -      |       -       | YES
      #   a page that renders but is never emitted    |   -   |      -      |       -       | YES
      #   asset <script src> / <img src> in dist      |   -   |      -      |       -       | YES
      #   external URL reachability                   |   -   |      -      |       -       |  -   (link-check.yml `external`, weekly)
      #   #fragment / anchor targets                  |   -   |      -      |       -       |  -   (unguarded; see the script header)
      #   relative ./x refs in built HTML             |   -   |      -      |    partly     | warn (see the script header)
      #
      # The lychee-source cell for the raw-HTML row is measured, not inferred:
      # appending <a href="/cli/init.html"> to a page makes lychee report
      # ".linkcheck-root/cli/init.html (at 3:10) | File not found". An earlier
      # draft of this table put a dash there and so argued for keeping a sibling
      # gate on a premise that was wrong — the same kind of misleading note this
      # change set out to remove. Re-measure a cell before trusting it.
      #
      # So: THIS step is the only one that sees the config.ts, frontmatter and
      # raw-HTML classes, and the only one that checks what actually shipped.
      # The source gates in link-check.yml are the only ones that run on a
      # source-only change without a build, and the only ones that name a
      # REPOSITORY path rather than a dist path when they fail — which is what a
      # contributor can act on. Keep both.
      #
      # The script refuses to report a clean result unless it can prove, in the
      # same run, that it inspected the artifact: in-process canaries (one link
      # that must resolve, one that must not, one missing the base prefix) run
      # before the scan, and floors on pages walked, references examined and
      # distinct targets resolved fail the job if any is implausibly low. The
      # canaries are in-process rather than a separate step on purpose — a
      # separate step can be deleted while the gate keeps reporting green.
      #
      # It prints its census (counts per resolution rule and per exclusion
      # class), because "passed" with no numbers is indistinguishable from
      # "inspected nothing". Read that output when reviewing this job.
      #
      # Verified on 92925e5: a one-character typo in the config.ts navbar link
      # (/why -> /whyy) leaves `npm run docs:build` exiting 0 while shipping 424
      # dead references across 212 of 219 pages. This step fails on it.
      #
      # No `continue-on-error` and no `|| true`. Deliberately NOT `if: always()`
      # either: a failed build leaves no artifact, and measuring an absent or
      # stale dist is the exact failure mode this exists to prevent. The script
      # refuses to pass when dist is missing, so both directions are covered.
      - name: Check the built artifact for dead internal links
        run: node scripts/check-dist-links.mjs
