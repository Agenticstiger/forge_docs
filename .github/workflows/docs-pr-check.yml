name: Docs PR Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The build is the gate. docs/.vuepress/config.ts sets the theme's
      # linksCheck plugin to `build: 'error'`, so VuePress throws and exits
      # non-zero on a dead internal link. Nothing here greps the log: a
      # log-string check passes whenever the message wording changes, and it
      # passed for exactly that reason before.
      - name: Build docs (fails on broken internal links)
        run: npm run docs:build
