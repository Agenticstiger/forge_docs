name: Docs PR Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build docs (fail on broken internal links)
        run: |
          set -o pipefail
          npm run docs:build 2>&1 | tee build.log
          if grep -q "Broken links found" build.log; then
            echo "::error::VuePress reported broken internal links — fix them before merge."
            echo "::error::Base-prefixed links must use /forge_docs/<path>.html (not .md); or use a relative ./<path>.md path."
            grep "Broken links found" build.log
            exit 1
          fi
          echo "✅ No broken internal links."
